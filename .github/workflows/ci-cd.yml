name: CI/CD Pipeline

# ── 트리거 ────────────────────────────────────────────────────
# main / develop 브랜치 push 시 실행.
# 관련 경로가 변경된 경우에만 워크플로 실행 (docs-only 변경은 건너뜀).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - "uou-capstone/**"
      - "ai-service/**"
      - "docker-compose*.yml"
      - "deploy.sh"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "uou-capstone/**"
      - "ai-service/**"
      - "docker-compose*.yml"
      - "deploy.sh"
      - ".github/workflows/**"
  workflow_dispatch:

# ── 전역 변수 ─────────────────────────────────────────────────
env:
  GHCR_REGISTRY: ghcr.io
  SPRING_IMAGE_NAME: ${{ github.repository_owner }}/main-service
  AI_IMAGE_NAME: ${{ github.repository_owner }}/ai-service

jobs:

  # ── 변경 감지 ──────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      spring: ${{ steps.filter.outputs.spring }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            spring:
              - "uou-capstone/**"
              - "docker-compose*.yml"
              - ".github/workflows/**"
            ai:
              - "ai-service/**"
              - "docker-compose*.yml"
              - ".github/workflows/**"

  # ── Spring Boot: 테스트 + 빌드 + GHCR 푸시 ────────────────
  build-spring:
    name: Build & Push Spring Image
    needs: detect-changes
    if: needs.detect-changes.outputs.spring == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v4

      # ── 테스트 ────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: uou-capstone
        run: chmod +x gradlew

      - name: Debug Spring checkout state
        shell: bash
        run: |
          echo "PWD=$(pwd)"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "RUNNER_OS=${RUNNER_OS}"
          git rev-parse HEAD
          git branch --show-current || true
          git log --oneline -n 3
          git status --short
          echo ""
          echo "== JwtTokenProvider.java =="
          nl -ba uou-capstone/src/main/java/io/github/uou_capstone/aiplatform/security/jwt/JwtTokenProvider.java | sed -n '45,80p'
          echo ""
          echo "== JwtTokenProviderTest.java =="
          nl -ba uou-capstone/src/test/java/io/github/uou_capstone/aiplatform/security/jwt/JwtTokenProviderTest.java | sed -n '70,110p'

      - name: Run Spring tests
        working-directory: uou-capstone
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Build Spring Boot jar
        working-directory: uou-capstone
        run: ./gradlew bootJar --no-daemon

      # ── 이미지 태그 계산 ──────────────────────────────────
      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RAW_REF="pr-${{ github.event.pull_request.number }}"
          else
            RAW_REF="${GITHUB_REF_NAME}"
          fi
          SAFE_REF="$(echo "$RAW_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g')"
          echo "IMAGE_TAG=${SAFE_REF}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "LATEST_TAG=${SAFE_REF}-latest" >> "$GITHUB_OUTPUT"

      # ── GHCR 로그인 ───────────────────────────────────────
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Buildx 설정 (레이어 캐시 활용) ───────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 빌드 & 푸시 ───────────────────────────────────────
      # SHA 태그(감사/롤백용) + 브랜치-latest 포인터 태그 동시 푸시
      - name: Build and push Spring image
        uses: docker/build-push-action@v5
        with:
          context: uou-capstone
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.SPRING_IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ env.GHCR_REGISTRY }}/${{ env.SPRING_IMAGE_NAME }}:${{ steps.tag.outputs.LATEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── FastAPI AI Service: 테스트 + 빌드 + GHCR 푸시 ─────────
  # ai-service/Dockerfile 이 존재해야 이 잡이 실제로 빌드를 수행합니다.
  # Dockerfile 없이 push 하면 "AI Service ready" 체크 단계에서 잡이 조기 종료(skipped)됩니다.
  build-ai:
    name: Build & Push AI Image
    needs: detect-changes
    if: needs.detect-changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v4

      # ── ai-service/Dockerfile 존재 확인 ──────────────────
      # Dockerfile 이 없으면 AI팀 준비 전이므로 이후 단계를 건너뜁니다.
      - name: Check AI Service is ready to build
        id: ai_ready
        run: |
          if [ ! -f "ai-service/Dockerfile" ]; then
            echo "::warning::ai-service/Dockerfile 이 없습니다. AI_SERVICE_INTEGRATION_SPEC.md 를 AI팀에 전달하세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 테스트 ────────────────────────────────────────────
      - name: Set up Python 3.11
        if: steps.ai_ready.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install AI dependencies
        if: steps.ai_ready.outputs.ready == 'true'
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Run AI tests
        if: steps.ai_ready.outputs.ready == 'true'
        working-directory: ai-service
        run: python -m pytest tests/ -v --tb=short

      # ── 이미지 태그 계산 ──────────────────────────────────
      - name: Compute image tag
        if: steps.ai_ready.outputs.ready == 'true'
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RAW_REF="pr-${{ github.event.pull_request.number }}"
          else
            RAW_REF="${GITHUB_REF_NAME}"
          fi
          SAFE_REF="$(echo "$RAW_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g')"
          echo "IMAGE_TAG=${SAFE_REF}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "LATEST_TAG=${SAFE_REF}-latest" >> "$GITHUB_OUTPUT"

      # ── GHCR 로그인 ───────────────────────────────────────
      - name: Log in to GHCR
        if: steps.ai_ready.outputs.ready == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Buildx 설정 ───────────────────────────────────────
      - name: Set up Docker Buildx
        if: steps.ai_ready.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      # ── 빌드 & 푸시 ───────────────────────────────────────
      - name: Build and push AI image
        if: steps.ai_ready.outputs.ready == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ai-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.AI_IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ env.GHCR_REGISTRY }}/${{ env.AI_IMAGE_NAME }}:${{ steps.tag.outputs.LATEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── EC2 배포 ───────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    # build-spring / build-ai 중 하나라도 성공하고, 어느 것도 실패하지 않으면 배포
    needs: [build-spring, build-ai]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.build-spring.result == 'success' || needs.build-ai.result == 'success') &&
      needs.build-spring.result != 'failure' &&
      needs.build-ai.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-northeast-2' }}

      - name: Deploy via AWS Systems Manager
        env:
          SSM_TARGET_PROJECT: AITutor
          SSM_TARGET_ROLE: app
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          cat > ssm-parameters.json <<JSON
          {
            "commands": [
              "set -euo pipefail",
              "git config --system --add safe.directory /home/ec2-user/UOU_Capstone_design_Be_v3 || git config --global --add safe.directory /home/ec2-user/UOU_Capstone_design_Be_v3",
              "cd /home/ec2-user/UOU_Capstone_design_Be_v3",
              "bash deploy.sh '${DEPLOY_BRANCH}'"
            ]
          }
          JSON

          INSTANCE_IDS="$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=${SSM_TARGET_PROJECT}" "Name=tag:Role,Values=${SSM_TARGET_ROLE}" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)"

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "::error::No running EC2 instances found with tags Project=${SSM_TARGET_PROJECT}, Role=${SSM_TARGET_ROLE}."
            exit 1
          fi

          echo "Deploy target instance ids: ${INSTANCE_IDS}"

          COMMAND_ID="$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids $INSTANCE_IDS \
            --parameters file://ssm-parameters.json \
            --comment "Deploy ${DEPLOY_BRANCH} ${DEPLOY_SHA}" \
            --timeout-seconds 1800 \
            --max-concurrency "1" \
            --max-errors "0" \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM command id: ${COMMAND_ID}"

          for attempt in {1..120}; do
            STATUS="$(aws ssm list-commands \
              --command-id "$COMMAND_ID" \
              --query "Commands[0].Status" \
              --output text)"

            if [ "$STATUS" = "Success" ]; then
              break
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelling" ]; then
              echo "::error::SSM deploy command ended with status: ${STATUS}"
              aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --output text
              exit 1
            fi

            echo "SSM deploy status: ${STATUS} (${attempt}/120)"
            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM deploy command did not finish in time. Last status: ${STATUS}"
            aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --output text
            exit 1
          fi

          aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --output text

      - name: Print deployment summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 항목 | 값 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 브랜치 | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 커밋 | \`${GITHUB_SHA::7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Spring 빌드 | ${{ needs.build-spring.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AI 빌드 | ${{ needs.build-ai.result }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "| Spring 엔드포인트 | https://uouaitutor.duckdns.org |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Spring 엔드포인트 | https://dev.uouaitutor.duckdns.org |" >> "$GITHUB_STEP_SUMMARY"
          fi
