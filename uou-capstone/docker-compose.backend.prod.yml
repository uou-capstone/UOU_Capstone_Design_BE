# 배포용 Backend Docker Compose (EC2 서버)
# 사용법: docker compose -f docker-compose.backend.prod.yml up -d

services:
  # 공유 Redis (Spring + FastAPI 공용)
  redis-backend:
    image: redis:alpine
    container_name: backend-redis
    # 배포 환경에서는 포트 노출 최소화 (보안)
    # ports:
    #   - "${REDIS_BACKEND_PORT:-6380}:6379"  # 필요 시에만 주석 해제
    volumes:
      - backend-redis-data:/data
    command: redis-server --save 60 1 --loglevel warning --appendonly yes
    networks:
      - backend-network  # Spring용
      - app-network      # FastAPI에서도 접근 가능하도록
    restart: always  # 배포 환경에서는 always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend 서비스 (Spring Boot) - 배포용
  backend:
    build:
      context: .  # 현재 디렉토리 (uou-capstone)
      dockerfile: Dockerfile
    container_name: backend-service
    ports:
      - "${BACKEND_PORT:-8080}:8080"  # 외부 접근 필요
    environment:
      # 데이터베이스 설정 (외부 MySQL 사용)
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-uoucapstone}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF8
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      # Redis 설정 (Spring + FastAPI 공유)
      - SPRING_DATA_REDIS_HOST=redis-backend
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_DATABASE=0
      # AI 서비스 설정 (외부 AI 서비스 사용)
      - AI_SERVICE_BASE_URL=${AI_SERVICE_BASE_URL:-http://ai-service:8000}
      - AI_SERVICE_SECRET_KEY=${AI_SERVICE_SECRET_KEY}
      # JWT 설정
      - JWT_SECRET=${JWT_SECRET}
      # 프로파일 (배포 환경)
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
    networks:
      - backend-network  # Backend 전용 네트워크 (Redis 포함)
      - app-network  # FastAPI와 통신용 공유 네트워크
    depends_on:
      redis-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: always  # 배포 환경에서는 always
    # 리소스 제한 (선택적)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '1'
    #       memory: 1G

volumes:
  backend-redis-data:
    driver: local

networks:
  backend-network:
    driver: bridge  # Backend 전용 네트워크 (Redis, Backend)
  app-network:
    name: app-network
    external: true  # FastAPI와 통신용 공유 네트워크
