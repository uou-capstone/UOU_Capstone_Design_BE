# 배포용 MySQL Docker Compose (EC2 서버)
# 사용법: docker compose -f docker-compose.mysql.prod.yml up -d

services:
  # MySQL 데이터베이스 (배포용)
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uoucapstone}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    # 배포 환경에서는 포트 노출 최소화 (보안)
    # 외부 접근이 필요한 경우에만 주석 해제
    # ports:
    #   - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 백업 스크립트 (선택적)
      # - ./backup-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: always  # 배포 환경에서는 always
    # 리소스 제한 (선택적)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '1'
    #       memory: 1G

volumes:
  mysql-data:
    driver: local

networks:
  app-network:
    name: app-network  # 네트워크 이름 지정 (다른 서비스와 공유)
    external: true  # 기존 네트워크 사용