# 하이브리드 모드: MySQL + Redis만 Docker로 실행, Spring Boot는 IDE에서 실행
# 사용법: docker compose -f docker-compose.local-hybrid.yml up -d
# → IDE에서 Spring Boot 실행 (Profile: local)

services:
  # MySQL 데이터베이스 (로컬 개발용)
  mysql:
    image: mysql:8.0
    container_name: mysql-db-local
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uoucapstone}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    ports:
      - "${MYSQL_PORT:-3306}:3306"  # IDE에서 localhost:3306 접근
    volumes:
      - mysql-data-local:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network-local
    restart: unless-stopped

  # Backend 전용 Redis (로컬 개발용)
  redis-backend:
    image: redis:alpine
    container_name: backend-redis-local
    ports:
      - "${REDIS_BACKEND_PORT:-6379}:6379"  # IDE에서 localhost:6379 접근
    volumes:
      - backend-redis-data-local:/data
    command: redis-server --save 60 1 --loglevel warning --appendonly yes
    networks:
      - backend-network-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data-local:
    driver: local
  backend-redis-data-local:
    driver: local

networks:
  backend-network-local:
    driver: bridge
  app-network-local:
    driver: bridge
