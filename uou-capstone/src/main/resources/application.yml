# 공통 설정 (모든 환경에서 공통)
server:
  port: 8080

jwt:
  # Access Token 유효 시간 (30분)
  access-token-expiration-time: 1800000
  # Refresh Token 유효 시간 (2주)
  refresh-token-expiration-time: 1209600000

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # RedisRepository(JpaRepository와 혼재) 스캔 비활성화
  # - spring-boot-starter-data-redis를 사용하지만 Redis Repository는 쓰지 않는 경우 로그 노이즈 제거 목적
  data:
    redis:
      repositories:
        enabled: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  security:
    oauth2:
      client:
        registration:
          kakao:
            # 보안: 환경 변수로 설정 (기본값 제거)
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
            scope:
              - profile_nickname
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# Actuator 설정 — 기본적으로 최소한만 노출
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never       # 외부에는 UP/DOWN만 노출
      show-components: never
  info:
    env:
      enabled: false            # 환경변수 노출 차단

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  info:
    title: AI튜터
    description:
    version: v2.0.0

# OAuth2 리다이렉트 설정
oauth2:
  redirect:
    # 프론트엔드 URL (환경 변수로 오버라이드 가능)
    frontend-url: ${OAUTH2_FRONTEND_URL:http://localhost:3000}
    # 리다이렉트 경로 (환경 변수로 오버라이드 가능)
    path: ${OAUTH2_REDIRECT_PATH:/auth/callback}

# AI 서비스 — 공통 기본 선언 (프로필별 yml에서 override)
# secret-key 는 FastAPI AI_SECRET_KEY 와 동일 값. prod 프로필에서 blank/placeholder면 부팅 실패.
ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:}
    secret-key: ${AI_SERVICE_SECRET_KEY:}
