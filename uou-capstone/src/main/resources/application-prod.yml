# 배포 환경 설정 (EC2)
# 사용법: SPRING_PROFILES_ACTIVE=prod (Docker 환경 변수로 설정)

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql-db}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:uoucapstone}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}  # 환경 변수 필수
    hikari:
      # 사이징 근거: materialGen(max 10) + examGrading(max 5) + taskExecutor(max 5) = 20 async worker
      # 각 워커가 @Transactional 안에서 WebClient.block()으로 커넥션을 오래 점유할 수 있어
      # async worker 수 + Tomcat 동시 읽기를 여유 있게 커버하도록 20으로 설정
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000       # 30s - 커넥션을 얻지 못하면 실패
      max-lifetime: 1800000            # 30m - MySQL wait_timeout보다 짧게
      idle-timeout: 600000             # 10m
      leak-detection-threshold: 60000  # 60s 이상 커넥션 보유 시 스택트레이스 로그

  jpa:
    hibernate:
      # 스키마는 Flyway가 책임. Hibernate는 entity ↔ DB 컬럼 mismatch 검사만 수행 (mismatch 시 부팅 실패 → 즉시 알람)
      ddl-auto: validate
    show-sql: false  # prod에서는 SQL 로깅 비활성화 (PII 유출 방지 + 성능)

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 이미 데이터가 있는 운영 DB에 Flyway를 처음 적용할 때 V1을 baseline으로 기록 (V1 SQL 자체는 실행하지 않음)
    # 빈 DB(예: 신규 환경)에서는 V1부터 순차 실행
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis-backend}  # Docker 컨테이너 이름
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  security:
    oauth2:
      client:
        registration:
          kakao:
            redirect-uri: ${KAKAO_REDIRECT_URI:http://your-domain.com/login/oauth2/code/kakao}  # 배포 도메인

logging:
  level:
    root: INFO
    # Spring Framework - 에러만 표시
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.data.redis: WARN
    # Hibernate/JPA - 에러만 표시
    org.hibernate: WARN
    org.hibernate.orm: WARN
    org.hibernate.SQL: WARN  # prod에서는 SQL 쿼리 로그도 비활성화
    # Redis Lettuce - 에러만 표시
    io.lettuce.core: WARN
    # Tomcat HTTP 파싱 에러 로그 줄이기 (HTTPS 요청을 HTTP로 받는 경우 등)
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    # 우리 프로젝트 로그는 INFO로 유지 (에러 디버깅용)
    io.github.uou_capstone: INFO
    # Swagger는 INFO로 유지
    org.springdoc: INFO

# Actuator — prod에서는 health만 노출, 상세정보 차단
management:
  endpoints:
    web:
      exposure:
        include: health
    enabled-by-default: false   # 전체 비활성 후 필요한 것만 켜기
  endpoint:
    health:
      enabled: true
      show-details: never
      show-components: never

# CORS 설정 (프론트엔드 도메인)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://ai-lms.netlify.app}

# AI 서비스 설정 (배포 환경)
# - FastAPI는 /api/v2/* (Classic), /api/v3/* (Integrated) 경로를 사용한다.
ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://ai-service:8000}  # Docker 네트워크 내부 주소
    secret-key: ${AI_SERVICE_SECRET_KEY}  # 환경 변수 필수

# JWT 설정 (배포 환경 - 환경 변수 필수)
jwt:
  secret: ${JWT_SECRET}  # 환경 변수 필수

# OAuth2 리다이렉트 설정 (배포 환경)
oauth2:
  redirect:
    frontend-url: ${OAUTH2_FRONTEND_URL:https://ai-lms.netlify.app}
    path: ${OAUTH2_REDIRECT_PATH:/auth/callback}
