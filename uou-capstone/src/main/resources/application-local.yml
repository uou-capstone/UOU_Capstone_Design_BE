# 로컬 개발 환경 설정
# 사용법: SPRING_PROFILES_ACTIVE=local 또는 IDE에서 Active Profile 설정

server:
  port: 8081

spring:
  # 로컬에서만 쓰는 민감값/하드코딩은 application-local.private.yml로 분리하고 Git에 올리지 않는다.
  # - 파일이 없으면 무시(optional)
  config:
    import: "optional:classpath:application-local.private.yml"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/uoucapstone?useSSL=false&serverTimezone=UTC&characterEncoding=UTF8&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      # 스키마는 Flyway가 책임. validate로 두면 entity ↔ DB mismatch가 부팅 시 바로 드러남.
      # 빈 로컬 DB라면 Flyway가 V1__baseline_schema.sql을 실행해 스키마를 만든다.
      # 이미 사용 중인 로컬 DB라면 baseline-on-migrate가 V1을 baseline으로 기록(skip)하고 부팅한다.
      ddl-auto: validate
    show-sql: true  # SQL 로그 출력

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  data:
    redis:
      host: localhost  # 로컬 Redis (Docker 또는 로컬 설치)
      port: 6379
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  security:
    oauth2:
      client:
        registration:
          kakao:
        
            # 로컬에서는 OAuth 로그인을 사용하지 않는 경우가 많아, 빈 값이면 부팅이 실패한다.
            # 필요 시 환경변수(KAKAO_CLIENT_ID/SECRET)로 실제 값을 주입해 덮어쓴다.
            client-id: ${KAKAO_CLIENT_ID:local-dummy-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:local-dummy-kakao-client-secret}
            redirect-uri: "http://localhost:8081/login/oauth2/code/kakao"  # 로컬 리다이렉트

# Actuator — 로컬에서는 디버깅용으로 추가 엔드포인트 노출
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops
  endpoint:
    health:
      show-details: always      # 로컬에서는 DB/Redis 상태 상세 확인 가능
      show-components: always

logging:
  level:
    root: INFO
    org.springdoc: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    io.github.uou_capstone: DEBUG

# AI 서비스 설정 (로컬 개발)
# - 호스트만 지정 (슬래시로 끝나도 무방). 경로는 코드에서 /api/v2/*, /api/v3/* 로 붙인다.
ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:https://plutean-clement-apheliotropically.ngrok-free.dev/}
    secret-key: ${AI_SERVICE_SECRET_KEY:YOUR_SUPER_SECRET_AI_KEY_12345}

# JWT 설정 (로컬 개발용 기본값)
jwt:
  secret: ${JWT_SECRET}

# OAuth2 리다이렉트 설정 (로컬 개발)
oauth2:
  redirect:
    frontend-url: ${OAUTH2_FRONTEND_URL:http://localhost:3000}
    path: ${OAUTH2_REDIRECT_PATH:/auth/callback}
