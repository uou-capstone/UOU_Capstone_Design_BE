# 로컬 개발 환경 설정
# 사용법: SPRING_PROFILES_ACTIVE=local 또는 IDE에서 Active Profile 설정

server:
  port: 8081

spring:
  # 로컬에서만 쓰는 민감값/하드코딩은 application-local.private.yml로 분리하고 Git에 올리지 않는다.
  # - 파일이 없으면 무시(optional)
  config:
    import: "optional:classpath:application-local.private.yml"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/uoucapstone?useSSL=false&serverTimezone=UTC&characterEncoding=UTF8&allowPublicKeyRetrieval=true
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: create  # 로컬 개발: create (테이블 자동 생성)
    show-sql: true  # SQL 로그 출력

  data:
    redis:
      host: localhost  # 로컬 Redis (Docker 또는 로컬 설치)
      port: 6379
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  security:
    oauth2:
      client:
        registration:
          kakao:
        
            # 로컬에서는 OAuth 로그인을 사용하지 않는 경우가 많아, 빈 값이면 부팅이 실패한다.
            # 필요 시 환경변수(KAKAO_CLIENT_ID/SECRET)로 실제 값을 주입해 덮어쓴다.
            client-id: ${KAKAO_CLIENT_ID:local-dummy-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:local-dummy-kakao-client-secret}
            redirect-uri: "http://localhost:8081/login/oauth2/code/kakao"  # 로컬 리다이렉트

logging:
  level:
    root: INFO
    org.springdoc: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    io.github.uou_capstone: DEBUG

# AI 서비스 설정 (로컬 개발)
# - 호스트만 지정 (슬래시로 끝나도 무방). 경로는 코드에서 /api/v2/*, /api/v3/* 로 붙인다.
ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:https://plutean-clement-apheliotropically.ngrok-free.dev/}
    secret-key: ${AI_SERVICE_SECRET_KEY:YOUR_SUPER_SECRET_AI_KEY_12345}

# JWT 설정 (로컬 개발용 기본값)
jwt:
  secret: ${JWT_SECRET}

# OAuth2 리다이렉트 설정 (로컬 개발)
oauth2:
  redirect:
    frontend-url: ${OAUTH2_FRONTEND_URL:http://localhost:3000}
    path: ${OAUTH2_REDIRECT_PATH:/auth/callback}
